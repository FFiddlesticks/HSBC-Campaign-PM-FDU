name: Query Service Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-query-service:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install backend dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils python3-dev python3-venv python3 python3-pip

      - name: run test
        shell: bash
        run: |
          npm run backend:query &
          PID=$!
          echo "Service started PID=$PID"
          sleep 30
          curl "http://127.0.0.1:8000/get?sign_date=2025-10-07" || true
          kill $PID || true
